<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00318f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="割り勘ノート">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>旅の割り勘ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f5f7fb;
  --ink:#111a2e; --muted:#5c6880; --line:#d6dde9;
  --pine:#00318f; --pine-soft:#e2e8f6;
  --amber:#0d7ec4; --amber-soft:#e0f0fa;
  --shadow:0 1px 2px rgba(17,26,46,.06),0 6px 20px rgba(17,26,46,.07);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1020; --surface:#141c31; --surface-2:#1b2440;
    --ink:#e7ecf6; --muted:#95a1bd; --line:#2a3556;
    --pine:#7ba1ee; --pine-soft:#1a2649;
    --amber:#4fb8e8; --amber-soft:#122c3d;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0b1020; --surface:#141c31; --surface-2:#1b2440;
  --ink:#e7ecf6; --muted:#95a1bd; --line:#2a3556;
  --pine:#7ba1ee; --pine-soft:#1a2649;
  --amber:#4fb8e8; --amber-soft:#122c3d;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
  font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 96px;display:flex;flex-direction:column;gap:18px}
h1{font-family:"Zen Maru Gothic",sans-serif;font-size:22px;margin:0;letter-spacing:.04em}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head .sub{color:var(--muted);font-size:12px;letter-spacing:.08em}
.num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* settlement */
.settle{background:var(--surface);border-radius:18px;padding:18px;box-shadow:var(--shadow);
  border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.settle .label{font-size:11px;letter-spacing:.18em;color:var(--muted)}
.settle .line{font-family:"Zen Maru Gothic",sans-serif;font-size:19px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.settle .amt{font-family:"JetBrains Mono",monospace;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.arrow{color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:5.5em 1fr auto;align-items:center;gap:10px;font-size:13px}
.track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.fill{height:100%;border-radius:99px}
.fill.k{background:var(--pine)} .fill.m{background:var(--amber)}
.total{display:flex;justify-content:space-between;border-top:1px dashed var(--line);padding-top:10px;font-size:13px;color:var(--muted)}

/* form */
form{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
legend{font-size:11px;letter-spacing:.16em;color:var(--muted);padding:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{flex:1 1 auto;min-width:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:9px 10px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface-2);font-size:13px;cursor:pointer;transition:.15s;white-space:nowrap}
.seg input:focus-visible+span{outline:2px solid var(--pine);outline-offset:2px}
.seg input:checked+span{background:var(--pine-soft);border-color:var(--pine);color:var(--pine);font-weight:700}
.seg.m input:checked+span{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cats label span{padding:9px 4px;font-size:12.5px}
.amount{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);
  border-radius:12px;padding:6px 12px}
.amount .yen{color:var(--muted);font-size:17px}
input[type=number],input[type=text],input[type=date]{border:0;background:transparent;color:var(--ink);
  font:inherit;width:100%;padding:6px 0;outline:none}
input[type=number]{font-family:"JetBrains Mono",monospace;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.row{display:flex;gap:10px}
.field{flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:4px 12px;min-width:0}
.split-detail{display:none;gap:10px}
.split-detail.on{display:flex}
.split-detail .field{display:flex;align-items:center;gap:6px}
.split-detail .nm{font-size:12px;color:var(--muted);white-space:nowrap}
.split-detail input{font-family:"JetBrains Mono",monospace;font-size:16px;font-weight:700;text-align:right}
.photo{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.photo input{display:none}
.btn{font:inherit;font-family:"Zen Maru Gothic",sans-serif;border-radius:12px;cursor:pointer;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink);padding:9px 14px;font-size:13px}
.btn.primary{background:var(--pine);border-color:var(--pine);color:#fff;font-size:16px;padding:14px;font-weight:700;width:100%}
.btn:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.thumb{width:40px;height:40px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}

/* list */
.day{display:flex;flex-direction:column;gap:8px}
.day-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);
  letter-spacing:.06em;padding-inline:4px}
.rec{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:11px 13px 11px 0;overflow:hidden}
.stripe{align-self:stretch;border-radius:99px}
.rec .who{font-size:11.5px;letter-spacing:.04em}
.rec .memo{font-weight:500}
.rec .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.chip{border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:11px;color:var(--muted)}
.rec .right{display:flex;align-items:center;gap:10px}
.rec .val{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.del{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;padding:2px 4px;line-height:1;border-radius:8px}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:26px 12px;border:1px dashed var(--line);border-radius:16px}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
dialog{border:0;border-radius:16px;padding:0;background:transparent;max-width:92vw}
dialog img{max-width:100%;border-radius:16px;display:block}
dialog::backdrop{background:rgba(0,0,0,.72)}
.note{font-size:11.5px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <div class="head">
    <h1>旅の割り勘ノート</h1>
    <span class="sub">きゃわさん × まっちゃん</span>
  </div>

  <section class="settle" aria-live="polite">
    <div class="label">いま清算すると</div>
    <div class="line" id="verdict"></div>
    <div class="bars">
      <div class="bar"><span>きゃわさん</span><div class="track"><div class="fill k" id="barK"></div></div><span class="num" id="paidK">¥0</span></div>
      <div class="bar"><span>まっちゃん</span><div class="track"><div class="fill m" id="barM"></div></div><span class="num" id="paidM">¥0</span></div>
    </div>
    <div class="total"><span>旅の合計</span><span class="num" id="grand">¥0</span></div>
  </section>

  <form id="form">
    <fieldset>
      <legend>払った人</legend>
      <div class="seg" id="payerSeg">
        <label><input type="radio" name="payer" id="payerK" value="k" checked><span>きゃわさん</span></label>
        <label><input type="radio" name="payer" id="payerM" value="m"><span>まっちゃん</span></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>金額</legend>
      <div class="amount"><span class="yen">¥</span><input type="number" id="amount" inputmode="numeric" min="0" step="1" placeholder="0" required></div>
    </fieldset>

    <fieldset>
      <legend>負担のしかた</legend>
      <div class="seg" id="splitSeg">
        <label><input type="radio" name="split" id="splitHalf" value="half" checked><span>折半</span></label>
        <label><input type="radio" name="split" id="splitK" value="k"><span>きゃわさんの分</span></label>
        <label><input type="radio" name="split" id="splitM" value="m"><span>まっちゃんの分</span></label>
        <label><input type="radio" name="split" id="splitCustom" value="custom"><span>内訳</span></label>
      </div>
      <div class="split-detail" id="splitDetail">
        <div class="field"><span class="nm">きゃわ</span><input type="number" id="shareK" inputmode="numeric" min="0" placeholder="0"></div>
        <div class="field"><span class="nm">まっちゃん</span><input type="number" id="shareM" inputmode="numeric" min="0" placeholder="0"></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>カテゴリ</legend>
      <div class="seg cats" id="catSeg"></div>
    </fieldset>

    <div class="row">
      <div class="field"><input type="text" id="memo" placeholder="メモ（店名など）" maxlength="40"></div>
      <div class="field" style="flex:0 0 9.5em"><input type="date" id="date"></div>
    </div>

    <div class="photo">
      <label class="btn" for="photo">レシート写真</label>
      <input type="file" id="photo" accept="image/*" capture="environment">
      <span id="photoState">なし</span>
      <img class="thumb" id="photoThumb" alt="" hidden>
      <button type="button" class="btn" id="photoClear" hidden>取消</button>
    </div>

    <button type="submit" class="btn primary" id="submit">記録する</button>
  </form>

  <div id="list"></div>

  <div class="tools">
    <button class="btn" id="export">CSVで書き出す</button>
    <button class="btn" id="clearAll">全部消す</button>
  </div>
  <p class="note">記録はこのスマホの中だけに保存されます。</p>
</div>

<dialog id="viewer"><img id="viewerImg" alt="レシート"></dialog>

<script>
const CATS=["食事代","ガソリン代","交通費","宿泊代","入場料","その他"];
const NAME={k:"きゃわさん",m:"まっちゃん"};
const KEY="tabi-warikan-v1";
const yen=n=>"¥"+Math.round(n).toLocaleString("ja-JP");
const $=id=>document.getElementById(id);

let recs=[];
try{recs=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){recs=[]}
if(!recs.length){
  const t=new Date(),d=n=>new Date(t.getTime()-n*864e5).toISOString().slice(0,10);
  recs=[
    {id:1,date:d(0),payer:"k",amount:6400,cat:"宿泊代",memo:"宿（例）",sk:3200,sm:3200},
    {id:2,date:d(0),payer:"m",amount:4800,cat:"ガソリン代",memo:"給油（例）",sk:2400,sm:2400},
    {id:3,date:d(0),payer:"k",amount:3100,cat:"食事代",memo:"昼ごはん（例）",sk:1800,sm:1300}
  ];
}

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(recs))}catch(e){
  alert("保存できませんでした。写真が多いと容量がいっぱいになります。古い記録を消すか、写真なしで記録してください。")}};

CATS.forEach((c,i)=>{
  const l=document.createElement("label");
  l.innerHTML='<input type="radio" name="cat" id="cat'+i+'" value="'+c+'"'+(i===0?" checked":"")+'><span>'+c+'</span>';
  $("catSeg").appendChild(l);
});
$("date").value=new Date().toISOString().slice(0,10);

// payer tint on the split segment
const syncSeg=()=>{
  const m=$("payerM").checked;
  $("payerSeg").classList.toggle("m",m);
};
$("payerSeg").addEventListener("change",syncSeg); syncSeg();
$("splitSeg").addEventListener("change",()=>{
  const on=$("splitCustom").checked;
  $("splitDetail").classList.toggle("on",on);
  if(on&&$("amount").value){$("shareK").value=$("shareK").value||"";$("shareM").value=$("shareM").value||""}
});

// photo
let photoData=null;
$("photo").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f)return;
  const img=new Image(), url=URL.createObjectURL(f);
  img.onload=()=>{
    const max=900,s=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas");
    c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    photoData=c.toDataURL("image/jpeg",0.55);
    URL.revokeObjectURL(url);
    $("photoThumb").src=photoData; $("photoThumb").hidden=false;
    $("photoClear").hidden=false; $("photoState").textContent="添付あり";
  };
  img.src=url;
});
$("photoClear").addEventListener("click",()=>{
  photoData=null; $("photo").value=""; $("photoThumb").hidden=true;
  $("photoClear").hidden=true; $("photoState").textContent="なし";
});

$("form").addEventListener("submit",e=>{
  e.preventDefault();
  const amount=Math.round(Number($("amount").value));
  if(!(amount>0)){$("amount").focus();return}
  const split=document.querySelector('input[name="split"]:checked').value;
  let sk,sm;
  if(split==="half"){sk=amount/2; sm=amount-sk;}
  else if(split==="k"){sk=amount; sm=0;}
  else if(split==="m"){sk=0; sm=amount;}
  else{
    sk=Math.round(Number($("shareK").value)||0); sm=Math.round(Number($("shareM").value)||0);
    if(sk+sm!==amount){alert("内訳の合計が金額と合いません（"+yen(sk+sm)+" / "+yen(amount)+"）。");return}
  }
  recs.push({id:Date.now(),date:$("date").value||new Date().toISOString().slice(0,10),
    payer:document.querySelector('input[name="payer"]:checked').value,
    amount,cat:document.querySelector('input[name="cat"]:checked').value,
    memo:$("memo").value.trim(),sk,sm,photo:photoData||undefined});
  save();
  $("amount").value=""; $("memo").value=""; $("shareK").value=""; $("shareM").value="";
  $("splitHalf").checked=true; $("splitDetail").classList.remove("on");
  $("photoClear").click();
  render(); $("amount").focus();
});

$("list").addEventListener("click",e=>{
  const del=e.target.closest(".del");
  if(del){const id=Number(del.dataset.id);
    if(confirm("この記録を消しますか？")){recs=recs.filter(r=>r.id!==id);save();render()} return;}
  const th=e.target.closest(".thumb");
  if(th&&th.dataset.full){$("viewerImg").src=th.dataset.full;$("viewer").showModal()}
});
$("viewer").addEventListener("click",()=>$("viewer").close());

$("clearAll").addEventListener("click",()=>{
  if(confirm("記録を全部消します。よろしいですか？")){recs=[];save();render()}
});
$("export").addEventListener("click",()=>{
  const rows=[["日付","払った人","金額","きゃわさん負担","まっちゃん負担","カテゴリ","メモ"]]
    .concat(recs.slice().sort((a,b)=>a.date<b.date?-1:1)
      .map(r=>[r.date,NAME[r.payer],r.amount,r.sk,r.sm,r.cat,r.memo]));
  const csv="﻿"+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n");
  $("export").textContent="コピーしました";
  navigator.clipboard?.writeText(csv).catch(()=>{});
  setTimeout(()=>$("export").textContent="CSVで書き出す",1800);
});

function render(){
  const paid={k:0,m:0},owe={k:0,m:0};
  recs.forEach(r=>{paid[r.payer]+=r.amount;owe.k+=r.sk;owe.m+=r.sm});
  const grand=paid.k+paid.m;
  const net=paid.k-owe.k; // >0: きゃわさんが立て替え超過
  const v=$("verdict");
  if(Math.abs(net)<1){v.innerHTML='<span>ちょうど清算ずみ</span>';}
  else{
    const from=net>0?"m":"k", to=net>0?"k":"m";
    v.innerHTML='<span>'+NAME[from]+'</span><span class="arrow">→</span><span>'+NAME[to]+'</span><span class="amt">'+yen(Math.abs(net))+'</span>';
  }
  const mx=Math.max(paid.k,paid.m,1);
  $("barK").style.width=(paid.k/mx*100)+"%"; $("barM").style.width=(paid.m/mx*100)+"%";
  $("paidK").textContent=yen(paid.k); $("paidM").textContent=yen(paid.m); $("grand").textContent=yen(grand);

  const list=$("list"); list.innerHTML="";
  if(!recs.length){list.innerHTML='<div class="empty">まだ記録がありません。<br>上のフォームから最初の支払いを入れてください。</div>';return}
  const days={}; recs.forEach(r=>{(days[r.date]=days[r.date]||[]).push(r)});
  Object.keys(days).sort().reverse().forEach(d=>{
    const sec=document.createElement("section"); sec.className="day";
    const sum=days[d].reduce((a,r)=>a+r.amount,0);
    const dt=new Date(d+"T00:00:00");
    const head=document.createElement("div"); head.className="day-head";
    head.innerHTML='<span>'+(dt.getMonth()+1)+'月'+dt.getDate()+'日（'+"日月火水木金土"[dt.getDay()]+'）</span><span class="num">'+yen(sum)+'</span>';
    sec.appendChild(head);
    days[d].slice().reverse().forEach(r=>{
      const el=document.createElement("article"); el.className="rec";
      const tint=r.payer==="k"?"var(--pine)":"var(--amber)";
      const share=r.sk===r.sm?"折半":(r.sm===0?"きゃわさん負担":(r.sk===0?"まっちゃん負担":"内訳 "+yen(r.sk)+"／"+yen(r.sm)));
      el.innerHTML='<div class="stripe" style="background:'+tint+'"></div>'+
        '<div><div class="who" style="color:'+tint+'">'+NAME[r.payer]+' が支払い</div>'+
        '<div class="memo">'+(r.memo||r.cat)+'</div>'+
        '<div class="meta"><span class="chip">'+r.cat+'</span><span>'+share+'</span></div></div>'+
        '<div class="right">'+(r.photo?'<img class="thumb" src="'+r.photo+'" data-full="'+r.photo+'" alt="レシート">':'')+
        '<span class="val">'+yen(r.amount)+'</span>'+
        '<button class="del" data-id="'+r.id+'" aria-label="削除">×</button></div>';
      sec.appendChild(el);
    });
    list.appendChild(sec);
  });
}
render();
</script>

</body>
</html>
